name: build

# Builds jtty-sidecar on Windows x64 with the MSYS2 mingw64 toolchain (the
# same one compile.bat uses), runs the self tests, and keeps the binaries as a
# workflow artifact. A tag of the form v1.2.3 also adds the zip and SHA256SUMS.txt
# to that tag's GitHub Release. The release itself, with the signed bare
# executable and its SHA-256, is created by deploy.ps1 on the publisher's
# machine (the signing key is on a hardware token there), so this job only
# ever ADDS to it. Stable URLs:
#   https://github.com/<owner>/jtty-sidecar/releases/latest/download/jtty-sidecar-win64.zip
#   https://github.com/<owner>/jtty-sidecar/releases/latest/download/jtty-sidecar.exe        (signed, from deploy)
#   https://github.com/<owner>/jtty-sidecar/releases/latest/download/jtty-sidecar.exe.sha256

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # needed only by the release step

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Stage dist
        run: |
          mkdir -p dist
          cp build/jtty-sidecar.exe build/jtty-shm-client.exe dist/
          dist/jtty-sidecar.exe version

      - name: Self tests
        shell: cmd
        run: run-tests.bat

      - name: Package
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { 'dev-' + $env:GITHUB_SHA.Substring(0,7) }
          Copy-Item README.md, LICENSE dist/
          Copy-Item upstream/UPSTREAM.md dist/
          Compress-Archive -Path dist/* -DestinationPath "jtty-sidecar-win64.zip" -Force
          Copy-Item jtty-sidecar-win64.zip "jtty-sidecar-$v-win64.zip"
          $sums = @()
          foreach ($f in "jtty-sidecar-win64.zip", "jtty-sidecar-$v-win64.zip") {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $sums += "$h  $f"
          }
          $sums | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jtty-sidecar-win64
          path: |
            jtty-sidecar-*.zip
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jtty-sidecar-win64.zip
            jtty-sidecar-*-win64.zip
            SHA256SUMS.txt
          # the release and its notes come from deploy.ps1; this only adds the zip
          append_body: true
          body: |

            Source-built zip and SHA256SUMS.txt added by GitHub Actions from this tag.
